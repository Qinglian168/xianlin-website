# 贤霖科技官网 Nginx 反向代理配置
# 说明：把 80 端口转发到本机 8080（Node 服务），并托管 HTTPS 证书
#
# 使用方法：
#   1. 把本文件复制到服务器：/etc/nginx/conf.d/xianlin.conf
#   2. 把下面的 xianlin.com 全部替换成你的真实域名（两处：server_name 和 ssl_certificate）
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 注意：HTTPS 证书建议用 certbot 自动申请，它会自动改好 443 段配置：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d xianlin.com -d www.xianlin.com

server {
    listen 80;
    listen [::]:80;
    server_name xianlin.com www.xianlin.com;

    # 后台上传图片可能较大，放宽请求体限制
    client_max_body_size 20m;

    # 访问日志
    access_log /var/log/nginx/xianlin.access.log;
    error_log  /var/log/nginx/xianlin.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # 静态图片缓存 7 天，减轻 Node 压力
    location /images/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
